name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true update && sudo apt-get -o Acquire::Retries=3 -o Acquire::ForceIPv4=true install -y tmux zsh
      - name: Install br
        timeout-minutes: 5
        run: |
          curl -fsSL https://raw.githubusercontent.com/Dicklesworthstone/beads_rust/main/install.sh | bash -s -- --skip-skills --no-gum
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Run tests
        run: |
          # darwin 25+ requires LC_UUID on the test binary; linux is unaffected.
          if [ "$(uname -s)" = Darwin ]; then
            go test -ldflags=-linkmode=external ./broker/
          else
            go test ./broker/
          fi
          tests/run.sh && tests/tmux-facts.sh && tests/install.sh && tests/broker.sh
