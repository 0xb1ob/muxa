name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux python3 zsh
      - name: Run tests
        run: tests/run.sh && tests/tmux-facts.sh && tests/composer.sh
